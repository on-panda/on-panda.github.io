<!doctype html>
<!-- Generated by make; edit templates/404.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/img/on-panda-logo-256x256.png">
    <title>Page Not Found — onPanda</title>
    <script>
      (function () {
        var routes = {{routes}};
        var raw = window.location.pathname;
        var key = raw.replace(/\/+$/, '').toLowerCase();
        var target = routes[key];
        if (target && raw !== target) {
          window.location.replace(target + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Page Not Found</h1>
      <p>Looking for one of the following onPanda pages?</p>
      <ul>
{{links}}
      </ul>
    </main>
  </body>
</html>
